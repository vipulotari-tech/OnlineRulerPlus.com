<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" fill="none" role="img" aria-label="BLOG FIG. 05 · OS DISPLAY SCALING &amp; CSS PPI">
  <defs>
    <pattern id="bg-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ededf2" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="718" height="398" rx="14" fill="#fafafc" stroke="#d8d8de" stroke-width="1.5"/>
  <rect x="12" y="12" width="696" height="376" rx="10" fill="url(#bg-grid)"/>
  <g transform="translate(28, 24)">
    <rect x="0" y="0" width="330" height="22" rx="11" fill="#ffffff" stroke="#d8d8de" stroke-width="1"/>
    <circle cx="12" cy="11" r="3" fill="#0066cc"/>
    <text x="21" y="14.5" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#5f5f63" letter-spacing="0.4">BLOG FIG. 05 · OS DISPLAY SCALING &amp; CSS PPI</text>
  </g>

  <rect x="32" y="66" width="656" height="296" rx="12" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
  <text x="52" y="96" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1d1d1f">Same 15.6″ 1920×1080 Laptop Panel — How OS Scaling Changes Reported CSS Pixels</text>

  <text x="52" y="136" font-family="'Geist Mono', monospace" font-size="11.5" font-weight="700" fill="#1d1d1f">100% Scale (DPR 1.0)</text>
  <text x="52" y="154" font-family="'Geist Mono', monospace" font-size="10.5" fill="#5f5f63">1920 × 1080 CSS · 141.2 PPI</text>
  <rect x="260" y="122" width="400" height="36" rx="8" fill="#f5f5f7" stroke="#d8d8de"/>
  <rect x="260" y="122" width="272" height="36" rx="8" fill="#e6f0fa" stroke="#0066cc" stroke-width="1.5"/>
  <text x="274" y="145" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#0066cc">Uncalibrated 10 cm = 6.80 cm (−32%)</text>

  <text x="52" y="206" font-family="'Geist Mono', monospace" font-size="11.5" font-weight="700" fill="#1d1d1f">125% Scale (DPR 1.25)</text>
  <text x="52" y="224" font-family="'Geist Mono', monospace" font-size="10.5" fill="#5f5f63">1536 × 864 CSS · 113.0 PPI</text>
  <rect x="260" y="192" width="400" height="36" rx="8" fill="#f5f5f7" stroke="#d8d8de"/>
  <rect x="260" y="192" width="340" height="36" rx="8" fill="#e6f0fa" stroke="#0066cc" stroke-width="1.5"/>
  <text x="274" y="215" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#0066cc">Uncalibrated 10 cm = 8.50 cm (−15%)</text>

  <text x="52" y="276" font-family="'Geist Mono', monospace" font-size="11.5" font-weight="700" fill="#1d1d1f">Calibrated OnlineRulerPlus</text>
  <text x="52" y="294" font-family="'Geist Mono', monospace" font-size="10.5" fill="#0066cc">Locked via ID-1 Card / Diagonal</text>
  <rect x="260" y="262" width="400" height="36" rx="8" fill="#0066cc"/>
  <text x="274" y="285" font-family="'Geist Mono', monospace" font-size="11.5" font-weight="700" fill="#ffffff">True 10.00 cm = 10.00 cm (1:1 Physical Scale)</text>

  <text x="52" y="338" font-family="'Inter', system-ui, sans-serif" font-size="11.5" fill="#5f5f63">Note: OnlineRulerPlus tracks window.devicePixelRatio changes automatically so browser zoom stays accurate after calibration.</text>

</svg>
