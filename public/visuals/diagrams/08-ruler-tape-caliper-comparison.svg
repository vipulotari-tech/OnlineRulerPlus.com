<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" fill="none" role="img" aria-label="FIG. 08 · RULER VS MEASURING TAPE VS CALIPER">
  <defs>
    <pattern id="grid-08" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ededf2" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="718" height="398" rx="14" fill="#fafafc" stroke="#d8d8de" stroke-width="1.5"/>
  <rect x="12" y="12" width="696" height="376" rx="10" fill="url(#grid-08)"/>
  <g transform="translate(28, 26)">
    <rect x="0" y="0" width="325.2" height="22" rx="11" fill="#ffffff" stroke="#d8d8de" stroke-width="1"/>
    <circle cx="12" cy="11" r="3" fill="#0066cc"/>
    <text x="21" y="14.5" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#5f5f63" letter-spacing="0.4">FIG. 08 · RULER VS MEASURING TAPE VS CALIPER</text>
  </g>

  <!-- Col 1: Online Screen Ruler -->
  <g transform="translate(44, 78)">
    <rect x="0" y="0" width="200" height="278" rx="12" fill="#ffffff" stroke="#8ec0f2" stroke-width="1.5"/>
    <rect x="16" y="16" width="168" height="22" rx="11" fill="#e6f0fa"/>
    <text x="100" y="31" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#0066cc">ONLINE SCREEN RULER</text>

    <!-- Icon: Straight screen ruler -->
    <rect x="24" y="62" width="152" height="36" rx="5" fill="#f5f5f7" stroke="#1d1d1f" stroke-width="1.75"/>
    <path d="M 40 62 v14 M 56 62 v9 M 72 62 v14 M 88 62 v9 M 104 62 v14 M 120 62 v9 M 136 62 v14 M 152 62 v9" stroke="#1d1d1f" stroke-width="1.4"/>

    <text x="16" y="132" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#1d1d1f">Flat &amp; Planar Objects</text>
    <text x="16" y="154" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5f5f63">Cards, screws, UI layouts,</text>
    <text x="16" y="171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5f5f63">envelopes, 2D blueprints</text>

    <line x1="16" y1="194" x2="184" y2="194" stroke="#d8d8de"/>
    <text x="16" y="216" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#1d1d1f">Tolerance: ±0.1–0.3 mm</text>
    <text x="16" y="236" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5f5f63">Span: Active screen</text>
    <text x="16" y="256" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#0066cc">Instant 1:1 on glass</text>
  </g>

  <!-- Col 2: Flexible Measuring Tape -->
  <g transform="translate(260, 78)">
    <rect x="0" y="0" width="200" height="278" rx="12" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
    <rect x="16" y="16" width="168" height="22" rx="11" fill="#f5f5f7"/>
    <text x="100" y="31" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#1d1d1f">MEASURING TAPE</text>

    <!-- Icon: Curved tape -->
    <path d="M 30 92 C 54 56, 126 106, 170 68" stroke="#1d1d1f" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.16"/>
    <path d="M 30 92 C 54 56, 126 106, 170 68" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="30" cy="92" r="4" fill="#1d1d1f"/>
    <circle cx="170" cy="68" r="4" fill="#1d1d1f"/>

    <text x="16" y="132" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#1d1d1f">Curved &amp; Long Spans</text>
    <text x="16" y="154" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5f5f63">Circumferences, rooms,</text>
    <text x="16" y="171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5f5f63">luggage, furniture</text>

    <line x1="16" y1="194" x2="184" y2="194" stroke="#d8d8de"/>
    <text x="16" y="216" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#1d1d1f">Tolerance: ±1.0 mm</text>
    <text x="16" y="236" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5f5f63">Span: 1.5 m – 10 m</text>
    <text x="16" y="256" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5f5f63">Wraps non-flat edges</text>
  </g>

  <!-- Col 3: Vernier / Digital Caliper -->
  <g transform="translate(476, 78)">
    <rect x="0" y="0" width="200" height="278" rx="12" fill="#ffffff" stroke="#d8d8de" stroke-width="1.5"/>
    <rect x="16" y="16" width="168" height="22" rx="11" fill="#f5f5f7"/>
    <text x="100" y="31" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#1d1d1f">VERNIER CALIPER</text>

    <!-- Icon: Caliper jaws -->
    <path d="M 34 62 h 132 v 14 h -86 v 26 l -10 12 v -38 h -22 v 38 l -14 -14 Z" fill="#f5f5f7" stroke="#1d1d1f" stroke-width="1.75" stroke-linejoin="round"/>
    <rect x="92" y="65" width="40" height="8" rx="2" fill="#1d1d1f"/>

    <text x="16" y="132" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#1d1d1f">Machining Tolerances</text>
    <text x="16" y="154" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5f5f63">Inner/outer bore, shaft</text>
    <text x="16" y="171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5f5f63">diameters, CAD parts</text>

    <line x1="16" y1="194" x2="184" y2="194" stroke="#d8d8de"/>
    <text x="16" y="216" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#1d1d1f">Tolerance: ±0.02 mm</text>
    <text x="16" y="236" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5f5f63">Span: 150 mm (6 in)</text>
    <text x="16" y="256" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#5f5f63">Mechanical jaws required</text>
  </g>
  
</svg>
